  <radialGradient id="halo"><stop stop-color="#715FFF" stop-opacity=".32"/><stop offset=".48" stop-color="#218CDE" stop-opacity=".14"/><stop offset="1" stop-color="#0B1223" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#89ADD3" stroke-width=".7" opacity=".10"/></pattern>
