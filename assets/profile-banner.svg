<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
<title id="title">EFEDEV — Efe Bilir | Independent software developer</title>
<desc id="desc">Premium midnight developer banner with oversized EFEDEV typography, luminous cyan and violet geometry, and a holographic engineering emblem.</desc>
<defs>
