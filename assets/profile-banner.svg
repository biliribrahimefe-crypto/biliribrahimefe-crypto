  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="light"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="1280" height="360" rx="24"/></clipPath>
</defs>
