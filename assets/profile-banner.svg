  <linearGradient id="brand" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#70F5F2"/><stop offset=".54" stop-color="#54C5FF"/><stop offset="1" stop-color="#B88BFF"/></linearGradient>
